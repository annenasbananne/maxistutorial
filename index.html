<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxi ist ein Zitronendieb 🍋</title>
<style>
  :root {
    color-scheme: light;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ein paar dezente Wölkchen im Kinderbuch-Stil */
  .clouds {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .cloud {
    position: absolute;
    background: #f2f4f8;
    border-radius: 999px;
    opacity: 0.8;
  }

  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    background: #f2f4f8;
    border-radius: 999px;
  }

  .cloud1 { width: 140px; height: 50px; top: 8%; left: 8%; }
  .cloud1::before { width: 70px; height: 70px; top: -35px; left: 15px; }
  .cloud1::after { width: 55px; height: 55px; top: -25px; left: 75px; }

  .cloud2 { width: 110px; height: 40px; top: 12%; right: 10%; }
  .cloud2::before { width: 55px; height: 55px; top: -28px; left: 10px; }
  .cloud2::after { width: 45px; height: 45px; top: -20px; left: 60px; }

  /* Regenbogen: bogenförmig über den ganzen Viewport, blendet sich ein und bleibt stehen */
  .rainbow-wrap {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .rainbow-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .band {
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 1.4s ease-out forwards;
  }

  .band1 { animation-delay: 0.1s; }
  .band2 { animation-delay: 0.25s; }
  .band3 { animation-delay: 0.4s; }
  .band4 { animation-delay: 0.55s; }
  .band5 { animation-delay: 0.7s; }
  .band6 { animation-delay: 0.85s; }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  /* Text-Einblendung, erscheint über dem stehenden Regenbogen */
  .message {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 5vw;
  }

  .message h1 {
    font-size: clamp(2.2rem, 8vw, 6.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #1a1a1a;
    text-shadow: 0 2px 0 rgba(0,0,0,0.05);
    opacity: 0;
    transform: scale(0.85) translateY(20px);
    filter: blur(6px);
    animation: appear 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 2.4s;
  }

  @keyframes appear {
    0% {
      opacity: 0;
      transform: scale(0.85) translateY(20px);
      filter: blur(6px);
    }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }
  }

  .emoji {
    display: inline-block;
    opacity: 0;
    animation: pop 0.6s ease-out forwards;
    animation-delay: 3.1s;
  }

  @keyframes pop {
    0% { opacity: 0; transform: scale(0) rotate(-20deg); }
    70% { opacity: 1; transform: scale(1.3) rotate(8deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* Replay-Button */
  .replay {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    background: #ffffff;
    color: #1a1a1a;
    border: 2px solid #1a1a1a;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    opacity: 0;
    animation: fadeInBtn 0.6s ease forwards;
    animation-delay: 3.6s;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .replay:hover {
    background: #1a1a1a;
    color: #ffffff;
    transform: translateX(-50%) scale(1.05);
  }

  @keyframes fadeInBtn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="clouds">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
  </div>

  <div class="rainbow-wrap">
    <svg id="rainbowSvg" viewBox="0 0 200 100" preserveAspectRatio="none">
      <!-- Kinderbuch-Regenbogen: dicke, klar getrennte Streifen, bogenförmig über den ganzen Viewport -->
      <path class="band band1" pathLength="1" d="M2,100 A98,98 0 0 1 198,100" stroke="#e8352c" stroke-width="10"/>
      <path class="band band2" pathLength="1" d="M14,100 A86,86 0 0 1 186,100" stroke="#f7931e" stroke-width="10"/>
      <path class="band band3" pathLength="1" d="M26,100 A74,74 0 0 1 174,100" stroke="#ffd400" stroke-width="10"/>
      <path class="band band4" pathLength="1" d="M38,100 A62,62 0 0 1 162,100" stroke="#4fb84a" stroke-width="10"/>
      <path class="band band5" pathLength="1" d="M50,100 A50,50 0 0 1 150,100" stroke="#2e8fdc" stroke-width="10"/>
      <path class="band band6" pathLength="1" d="M62,100 A38,38 0 0 1 138,100" stroke="#7a4fbf" stroke-width="10"/>
    </svg>
  </div>

  <div class="message">
    <h1>Maxi ist ein<br>Zitronendieb <span class="emoji">🍋</span></h1>
  </div>

  <button class="replay" id="replayBtn">↻ Nochmal abspielen</button>

  <script>
    const bands = Array.from(document.querySelectorAll('.band'));
    const heading = document.querySelector('.message h1');
    const emoji = document.querySelector('.emoji');
    const replayBtn = document.getElementById('replayBtn');

    function playAnimation() {
      // Alle animierten Elemente klonen, damit die CSS-Animationen neu starten
      [...bands, heading, emoji, replayBtn].forEach(el => {
        const clone = el.cloneNode(true);
        el.parentNode.replaceChild(clone, el);
      });

      const newReplayBtn = document.getElementById('replayBtn');
      newReplayBtn.addEventListener('click', playAnimation);
    }

    replayBtn.addEventListener('click', playAnimation);
  </script>

</body>
</html>
